services:
  customer-service-agent:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      MOCK_MODE: "True"
      BUSINESS_DATA_PROVIDER: "mock"
      LLM_PROVIDER: "volcengine"
      LANGUAGE: "zh"
      _FAAS_RUNTIME_PORT: "8080"
    restart: unless-stopped
