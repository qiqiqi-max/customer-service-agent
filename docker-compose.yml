services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-customer_service}
      MYSQL_USER: ${MYSQL_USER:-customer_service}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-customer_service_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password_change_me}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  customer-service-agent:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      MOCK_MODE: "True"
      BUSINESS_DATA_PROVIDER: "mock"
      LLM_PROVIDER: "volcengine"
      LANGUAGE: "zh"
      DATABASE_URL: "mysql+pymysql://${MYSQL_USER:-customer_service}:${MYSQL_PASSWORD:-customer_service_password}@mysql:3306/${MYSQL_DATABASE:-customer_service}"
      _FAAS_RUNTIME_PORT: "8080"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql_data:
