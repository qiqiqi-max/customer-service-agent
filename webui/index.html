<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>客服工作台</title>
    <meta name="description" content="电商客服智能接待工作台" />
    <link rel="stylesheet" href="/static/styles.css?v=20260721-optimized" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%232563eb'/%3E%3Cpath d='M20 28h24M20 36h18' stroke='white' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-badge">客</div>
          <div>
            <p class="brand-name">客服工作台</p>
            <p class="brand-subtitle">智能接待系统</p>
          </div>
        </div>

        <section class="sidebar-section">
          <div class="section-heading">
            <h2>接待设置</h2>
          </div>

          <label class="field">
            <span>客户账号</span>
            <input id="account-id" type="text" value="100000" />
          </label>

          <label class="field">
            <span>回复模式</span>
            <select id="stream-mode" style="width: 100%; padding: 8px 10px; border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 6px; background: rgba(255, 255, 255, 0.08); color: white; font-size: 13px;">
              <option value="true">逐字显示</option>
              <option value="false">完整返回</option>
            </select>
          </label>
        </section>

        <section class="sidebar-section">
          <div class="section-heading">
            <h2>服务场景</h2>
          </div>
          <div id="scenario-chips" class="scenario-list"></div>
        </section>

        <section class="sidebar-section">
          <div class="section-heading">
            <h2>服务能力</h2>
          </div>
          <div id="function-grid" class="capability-list"></div>
        </section>

        <section class="sidebar-section">
          <div class="section-heading">
            <h2>历史会话</h2>
          </div>
          <div class="conversation-actions">
            <button type="button" id="new-conversation" class="mini-button">新会话</button>
            <button type="button" id="refresh-conversations" class="mini-button">刷新</button>
          </div>
          <div id="conversation-list" class="conversation-list"></div>
        </section>
      </aside>

      <main class="main-panel">
        <header class="topbar">
          <div>
            <h1>客服工作台</h1>
            <p class="topbar-subtitle">车载用品店 · Mock 演示模式</p>
          </div>
        </header>

        <section class="content-grid">
          <section class="conversation-panel">
            <div class="conversation-surface">
              <div class="conversation-header">
                <h2>对话记录</h2>
                <button type="button" id="clear-chat" class="button button-secondary">清空</button>
              </div>

              <div id="chat-thread" class="chat-thread"></div>

              <form id="composer-form" class="composer">
                <label>
                  <span class="sr-only">输入消息</span>
                  <textarea
                    id="composer-input"
                    rows="4"
                    placeholder="输入客户问题，例如：我之前买的腰靠垫现在送到哪里了？"
                  ></textarea>
                </label>
                <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 12px;">
                  <p style="margin: 0; color: var(--muted); font-size: 13px;">按 Enter 发送</p>
                  <button id="composer-submit" type="submit" class="button button-primary">发送</button>
                </div>
              </form>
            </div>
          </section>

          <aside class="details-panel">
            <section class="tabs">
              <div class="tab-list" role="tablist">
                <button type="button" class="tab-button is-active" data-tab="results" role="tab">结果</button>
                <button type="button" class="tab-button" data-tab="execution" role="tab">轨迹</button>
                <button type="button" class="tab-button" data-tab="ops" role="tab">沉淀</button>
              </div>

              <div class="tab-panel is-active" data-panel="results">
                <div id="result-cards" class="result-cards">
                  <div style="padding: 20px; text-align: center; color: var(--muted);">暂无结果</div>
                </div>
              </div>

              <div class="tab-panel" data-panel="execution">
                <div id="execution-timeline" class="execution-timeline">
                  <div style="padding: 20px; text-align: center; color: var(--muted);">暂无轨迹</div>
                </div>
              </div>

              <div class="tab-panel" data-panel="ops">
                <div style="padding: 12px;">
                  <button id="summary-btn" class="button button-secondary" style="width: 100%; margin-bottom: 12px;">生成会话总结</button>
                  <div id="summary-output" style="padding: 12px; background: var(--surface-soft); border-radius: 6px; min-height: 60px; color: var(--muted); font-size: 13px;">暂无总结</div>
                </div>
              </div>
            </section>
          </aside>
        </section>
      </main>
    </div>

    <template id="message-template">
      <article class="message-card">
        <div class="message-avatar"></div>
        <div class="message-content">
          <div class="message-body"></div>
        </div>
      </article>
    </template>

    <script src="/static/app.js?v=20260721-optimized" defer></script>
  </body>
</html>
